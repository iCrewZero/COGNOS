version: 2
updates:
  # Rust (Cargo) — workspace root
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      rust-deps: # Regroupe TOUTES les deps Rust dans 1 seule PR
        patterns:
          - "*"
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "deps(rust):"

  # Python — agents
  - package-ecosystem: pip
    directory: /agents
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-deps: # Regroupe TOUTES les deps Python dans 1 seule PR
        patterns:
          - "*"
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps(python):"

  # GitHub Actions — keep CI actions pinned and up-to-date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-deps: # Regroupe TOUTES les actions dans 1 seule PR
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps):"