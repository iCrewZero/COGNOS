name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hal-authorship-check:
    name: "HAL — Human Authorship Enforcement"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check for AI co-authorship in HAL commits
        run: |
          COMMITS=$(git log --format="%H" origin/main..HEAD 2>/dev/null || git log --format="%H" HEAD~1..HEAD)

          VIOLATION=0
          for COMMIT in $COMMITS; do
            CHANGED_FILES=$(git diff-tree --no-commit-id -r --name-only "$COMMIT")
            HAL_TOUCHED=$(echo "$CHANGED_FILES" | grep "^hal/" || true)

            if [ -n "$HAL_TOUCHED" ]; then
              COMMIT_MSG=$(git log -1 --format="%B" "$COMMIT")
              if echo "$COMMIT_MSG" | grep -iE "Co-authored-by: (Claude|GPT|Gemini|AI|LLM|ChatGPT|Copilot)" > /dev/null; then
                echo "::error::HAL authorship violation in commit $COMMIT"
                echo "HAL code must be human-written only."
                echo "Files changed: $HAL_TOUCHED"
                echo "Commit message contains AI co-author tag."
                VIOLATION=1
              fi
            fi
          done

          if [ "$VIOLATION" -eq 1 ]; then
            echo ""
            echo "ERROR: HAL changes require human-only authorship."
            echo "Remove AI co-authorship tags from commits touching hal/"
            exit 1
          fi

          echo "HAL authorship check passed."

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Install latest cargo-audit
        run: cargo install cargo-audit --locked --quiet
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit==2.7.3
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Audit Python dependencies
        run: |
          if [ -f agents/requirements.txt ]; then
            pip-audit -r agents/requirements.txt --desc
          fi

  ebpf-build-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install eBPF build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            linux-headers-generic \
            linux-tools-generic \
            linux-tools-common \
            linux-cloud-tools-generic || true
          # bpftool may be in a different package on this runner
          sudo apt-get install -y bpftool || \
          sudo apt-get install -y linux-tools-$(uname -r) || true

      - name: Verify bpftool is available
        run: |
          which bpftool || find /usr -name bpftool 2>/dev/null
          bpftool version

      - name: Generate vmlinux.h
        run: |
          bpftool btf dump file /sys/kernel/btf/vmlinux format c \
            > kernel/ebpf/vmlinux.h
          echo "Generated vmlinux.h ($(wc -l < kernel/ebpf/vmlinux.h) lines)"

      - name: Build eBPF programs
        run: |
          for prog in kernel/ebpf/*.bpf.c; do
            [ -e "$prog" ] || continue
            echo "Building $prog..."
            clang -O2 -target bpf \
              -D__TARGET_ARCH_x86 \
              -I kernel/ebpf \
              -I/usr/include/$(uname -m)-linux-gnu \
              -c "$prog" -o "${prog%.c}.o"
            if [ ! -s "${prog%.c}.o" ]; then
              echo "ERROR: $prog produced empty output"
              exit 1
            fi
            echo "  OK: ${prog%.c}.o"
          done
