name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hal-authorship-check:
    name: "HAL — Human Authorship Enforcement"
    runs-on: ubuntu-24.04
    # This job MUST pass before any PR merges to main.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for AI co-authorship in HAL commits
        run: |
          # Get all commits in this branch not in main
          COMMITS=$(git log --format="%H" origin/main..HEAD 2>/dev/null || git log --format="%H" HEAD~1..HEAD)

          VIOLATION=0
          for COMMIT in $COMMITS; do
            # Check if this commit touches hal/
            CHANGED_FILES=$(git diff-tree --no-commit-id -r --name-only "$COMMIT")
            HAL_TOUCHED=$(echo "$CHANGED_FILES" | grep "^hal/" || true)

            if [ -n "$HAL_TOUCHED" ]; then
              # Check commit message for AI authorship
              COMMIT_MSG=$(git log -1 --format="%B" "$COMMIT")
              if echo "$COMMIT_MSG" | grep -iE "Co-authored-by: (Claude|GPT|Gemini|AI|LLM|ChatGPT|Copilot)" > /dev/null; then
                echo "::error::HAL authorship violation in commit $COMMIT"
                echo "HAL code must be human-written only."
                echo "Files changed: $HAL_TOUCHED"
                echo "Commit message contains AI co-author tag."
                VIOLATION=1
              fi
            fi
          done

          if [ "$VIOLATION" -eq 1 ]; then
            echo ""
            echo "ERROR: HAL changes require human-only authorship."
            echo "Remove AI co-authorship tags from commits touching hal/"
            exit 1
          fi

          echo "HAL authorship check passed."

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Rust dependencies
        run: cargo audit --deny warnings

      - name: Audit Python dependencies
        run: |
          if [ -f agents/requirements.txt ]; then
            pip-audit -r agents/requirements.txt --desc
          fi

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python linters
        run: pip install ruff mypy

      - name: Clippy — no warnings allowed
        run: cargo clippy --workspace -- -D warnings

      - name: Rustfmt check
        run: cargo fmt --check

      - name: Ruff lint
        run: ruff check agents/

      - name: Mypy type check
        run: mypy agents/ --ignore-missing-imports --no-error-summary

  ebpf-build-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install eBPF build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-$(uname -r) || \
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-generic

      - name: Build eBPF programs
        run: |
          for prog in kernel/ebpf/*.bpf.c; do
            echo "Building $prog..."
            clang -O2 -target bpf \
              -I/usr/include/$(uname -m)-linux-gnu \
              -c "$prog" -o "${prog%.c}.o"

            # Verify output exists and is non-zero
            if [ ! -s "${prog%.c}.o" ]; then
              echo "ERROR: $prog produced empty output"
              exit 1
            fi
            echo "  OK: ${prog%.c}.o"
          done
