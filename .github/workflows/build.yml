name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build workspace
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            cargo build --workspace --release
          else
            cargo build --workspace
          fi

      - name: Run all Rust tests
        run: cargo test --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: Rustfmt check
        run: cargo fmt --check

      - name: Upload binaries
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cognos-binaries
          path: target/release/cognos-*

  build-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Install test/lint tools
        run: pip install ruff==0.8.0 mypy==1.13.0 pytest

      - name: Syntax check all agent files
        run: python -m py_compile agents/*.py

      - name: Ruff lint
        run: ruff check agents/

      - name: Run Python tests
        run: |
          if [ -d agents/tests ]; then
            python -m pytest agents/tests/ -v
          else
            echo "No agent tests directory yet — skipping"
          fi

      - name: Run threat model tests
        run: python -m pytest .github/workflows/threat_model_test.py -v --tb=short

  proto-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler

      - name: Verify proto compiles
        run: |
          protoc --proto_path=agents/shared/ipc/proto \
                 --descriptor_set_out=/dev/null \
                 agents/shared/ipc/proto/cognos.proto
          echo "Proto compilation OK"

  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: |
      github.ref == 'refs/heads/main' ||
      contains(github.event.pull_request.labels.*.name, 'kernel')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex \
            libssl-dev libelf-dev bc dwarves cpio pahole

      - name: Cache kernel source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/
          key: kernel-${{ hashFiles('kernel/config/cognos_defconfig') }}
          restore-keys: |
            kernel-

      - name: Build kernel
        run: bash build/kernel_build.sh

      - name: Verify required kernel config options
        run: bash build/verify_kernel_config.sh

      - name: Upload kernel debs
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cognos-kernel
          path: build/output/linux-*.deb

  # ─── Gate job: single required status check for branch protection ───────────
  ci-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [build-rust, build-python, proto-lint]
    if: always()
    steps:
      - name: Evaluate required job results
        run: |
          echo "build-rust: ${{ needs.build-rust.result }}"
          echo "build-python: ${{ needs.build-python.result }}"
          echo "proto-lint: ${{ needs.proto-lint.result }}"

          if [ "${{ needs.build-rust.result }}" != "success" ]; then
            echo "::error::build-rust failed or was cancelled"
            exit 1
          fi
          if [ "${{ needs.build-python.result }}" != "success" ]; then
            echo "::error::build-python failed or was cancelled"
            exit 1
          fi
          if [ "${{ needs.proto-lint.result }}" != "success" ]; then
            echo "::error::proto-lint failed or was cancelled"
            exit 1
          fi

          echo "All required jobs passed."
