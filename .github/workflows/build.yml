name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            pkg-config \
            libssl-dev \
            libfuse3-dev \
            protobuf-compiler \
            python3 \
            python3-venv \
            python3-pip \
            make

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Generate Python gRPC stubs
        run: make -C build proto

      - name: Check workspace (all targets, incl. FUSE + unix cfgs)
        run: cargo check --workspace --all-targets

      - name: Build workspace
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            cargo build --workspace --release --bins
          else
            cargo build --workspace --bins
          fi

      - name: Run all Rust tests
        run: cargo test --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: Rustfmt check
        run: cargo fmt --check

      - name: Upload binaries
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cognos-binaries
          path: target/release/cognos-*

  build-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Install test/lint tools
        run: pip install ruff==0.8.0 mypy==1.13.0 pytest

      - name: Syntax check all agent files
        run: python -m py_compile agents/*.py

      - name: Ruff lint
        run: ruff check agents/

      - name: Run Python tests
        run: python -m pytest agents/ -v

      - name: Run threat model tests
        run: python -m pytest .github/workflows/threat_model_test.py -v --tb=short

  proto-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler

      - name: Verify proto compiles
        run: |
          protoc --proto_path=agents/shared/ipc/proto \
                 --descriptor_set_out=/dev/null \
                 agents/shared/ipc/proto/cognos.proto
          echo "Proto compilation OK"

  e2e-intent:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            pkg-config \
            libssl-dev \
            libfuse3-dev \
            protobuf-compiler \
            python3 \
            python3-venv \
            python3-pip \
            make

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache Python venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-e2e-${{ runner.os }}-py3.12-${{ hashFiles('agents/requirements.txt') }}
          restore-keys: |
            venv-e2e-${{ runner.os }}-py3.12-

      - name: Set up Python venv for file_task
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -q -r agents/requirements.txt

      - name: Generate Python gRPC stubs
        run: make -C build proto

      - name: Build workspace binaries
        run: cargo build --workspace --bins

      - name: Run intent pipeline E2E tests
        env:
          COGNOS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: cargo test -p cognos-e2e-tests -- --include-ignored --nocapture

  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: |
      github.ref == 'refs/heads/main' ||
      contains(github.event.pull_request.labels.*.name, 'kernel')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex \
            libssl-dev libelf-dev bc dwarves cpio pahole

      - name: Cache kernel source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/
          key: kernel-${{ hashFiles('kernel/config/cognos_defconfig') }}
          restore-keys: |
            kernel-

      - name: Build kernel
        run: bash build/kernel_build.sh

      - name: Verify required kernel config options
        run: bash build/verify_kernel_config.sh

      - name: Upload kernel debs
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cognos-kernel
          path: build/output/linux-*.deb

  # ─── Gate job: single required status check for branch protection ───────────
  ci-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [build-rust, build-python, proto-lint, e2e-intent]
    if: always()
    steps:
      - name: Evaluate required job results
        run: |
          echo "build-rust: ${{ needs.build-rust.result }}"
          echo "build-python: ${{ needs.build-python.result }}"
          echo "proto-lint: ${{ needs.proto-lint.result }}"
          echo "e2e-intent: ${{ needs.e2e-intent.result }}"

          if [ "${{ needs.build-rust.result }}" != "success" ]; then
            echo "::error::build-rust failed or was cancelled"
            exit 1
          fi
          if [ "${{ needs.build-python.result }}" != "success" ]; then
            echo "::error::build-python failed or was cancelled"
            exit 1
          fi
          if [ "${{ needs.proto-lint.result }}" != "success" ]; then
            echo "::error::proto-lint failed or was cancelled"
            exit 1
          fi
          if [ "${{ needs.e2e-intent.result }}" != "success" ]; then
            echo "::error::e2e-intent failed or was cancelled"
            exit 1
          fi

          echo "All required jobs passed."
