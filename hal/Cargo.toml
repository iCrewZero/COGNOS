[package]
name = "cognos-hal"
version = "0.1.0"
edition = "2021"
description = "COGNOS Human Approval Layer — risk scoring, audit, and gate daemon"

[lib]
name = "cognos_hal"
path = "src/lib.rs"

[[bin]]
name = "cognos-hal"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
log = "0.4"
tracing = { version = "0.1", features = ["log"] }
thiserror = "2"
env_logger = "0.11"
regex = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
cognos-intent-engine = { path = "../intent-engine" }
