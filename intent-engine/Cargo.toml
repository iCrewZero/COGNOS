[package]
name = "cognos-intent-engine"
version = "0.1.0"
edition = "2021"
description = "COGNOS Intent Engine — parsing, validation, disambiguation, action graph"

[lib]
name = "cognos_intent_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
async-trait = "0.1"
toml = "1.1"
# HTTP-only client (localhost llama-server): no TLS backend, no FFI.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# Async runtime for the binary (own DispatchIntent server + IPC agent loop).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
# IPC transport: CognosServer/CognosClient + proto types. Path dep, low-level
# crate — no cycle (cognos-ipc-grpc does not depend on the intent-engine).
cognos-ipc-grpc = { path = "../ipc/grpc" }

[dev-dependencies]
wiremock = "0.6"

[[bin]]
name = "cognos-intent"
path = "src/bin/intent_main.rs"
