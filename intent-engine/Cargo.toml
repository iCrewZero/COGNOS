[package]
name = "cognos-intent-engine"
version = "0.1.0"
edition = "2021"
description = "COGNOS Intent Engine — parsing, validation, disambiguation, action graph"

[lib]
name = "cognos_intent_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
log = "0.4"
