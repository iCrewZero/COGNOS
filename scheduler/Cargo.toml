[package]
name = "cognos-scheduler"
version = "0.1.0"
edition = "2021"
description = "COGNOS adaptive resource scheduler — scenario detection and bounded cgroup policy"

[lib]
name = "cognos_scheduler"
path = "src/lib.rs"

[dependencies]
cognos-ipc-grpc = { path = "../ipc/grpc" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "fs", "process", "macros", "signal", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
tokio-util = "0.7"
num_cpus = "1"

[[bin]]
name = "cognos-scheduler"
path = "src/bin/scheduler_main.rs"
