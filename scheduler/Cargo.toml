[package]
name = "cognos-scheduler"
version = "0.1.0"
edition = "2021"
description = "COGNOS adaptive resource scheduler — scenario detection and bounded cgroup policy"

[lib]
name = "cognos_scheduler"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "time", "fs", "process", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
log = "0.4"
num_cpus = "1"
