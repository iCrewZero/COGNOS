[package]
name = "cognos-orchestrator"
version = "0.1.0"
edition = "2021"
description = "COGNOS orchestrator — multi-agent task graph execution"

[lib]
name = "cognos_orchestrator"
path = "src/lib.rs"

[dependencies]
cognos-ipc-grpc = { path = "../ipc/grpc" }
cognos-hal = { path = "../hal" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
async-trait = "0.1"

[[bin]]
name = "cognos-orchestrator"
path = "src/bin/orchestrator_main.rs"
