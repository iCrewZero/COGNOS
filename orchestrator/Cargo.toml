[package]
name = "cognos-orchestrator"
version = "0.1.0"
edition = "2021"
description = "COGNOS orchestrator — multi-agent task graph execution"

[lib]
name = "cognos_orchestrator"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "cognos-orchestrator"
path = "src/bin/orchestrator_main.rs"
