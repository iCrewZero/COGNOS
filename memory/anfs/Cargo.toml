[package]
name = "cognos-anfs"
version = "0.1.0"
edition = "2021"
description = "COGNOS AI-Native File System — FUSE semantic overlay, relationship graph, tag engine"

[lib]
name = "cognos_anfs"
path = "src/lib.rs"

[dependencies]
fuser = "0.14"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
