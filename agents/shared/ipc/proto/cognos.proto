syntax = "proto3";

package cognos.ipc.v1;

option go_package = "cognos/ipc/v1";
option java_multiple_files = true;
option java_package = "org.cognos.ipc.v1";

message IntentEnvelope {
  string envelope_id = 1;
  string intent_id = 2;

  string source_agent = 3;
  string target_agent = 4;

  string capability_token = 5;
  string action_graph_hash = 6;

  int64 timestamp_unix_ms = 7;
  string nonce = 8;

  string session_id = 9;
  string user_id = 10;

  string intent_type = 11;
  string intent_payload_json = 12;

  float risk_estimate = 13;
  float trust_score = 14;

  bool requires_hal = 15;

  repeated string requested_capabilities = 16;

  AuditContext audit = 17;
  Signature signature = 18;
}

message AuditContext {
  string audit_id = 1;
  string parent_hash = 2;
  string event_hash = 3;

  string originating_host = 4;
  string originating_process = 5;

  int64 created_at = 6;
}

message Signature {
  string algorithm = 1;
  bytes public_key = 2;
  bytes signature_bytes = 3;
}

message AgentResponse {
  bool success = 1;

  string response_id = 2;
  string request_envelope_id = 3;

  string responding_agent = 4;

  int64 timestamp_unix_ms = 5;

  string result_json = 6;

  repeated string warnings = 7;
  repeated string audit_events = 8;

  IPCError error = 9;
}

message IPCError {
  uint32 code = 1;
  string message = 2;
  bool retryable = 3;
}

message HeartbeatRequest {
  string agent_id = 1;
  int64 timestamp_unix_ms = 2;

  string version = 3;

  float cpu_usage = 4;
  float memory_usage = 5;

  repeated string active_capabilities = 6;
}

message HeartbeatResponse {
  bool accepted = 1;
  string orchestrator_time = 2;

  repeated string revoked_capabilities = 3;
}

message CapabilityRequest {
  string requesting_agent = 1;

  repeated string requested_capabilities = 2;

  string justification = 3;
  string intent_id = 4;
}

message CapabilityResponse {
  bool approved = 1;

  repeated string granted_capabilities = 2;
  repeated string denied_capabilities = 3;

  string hal_decision_id = 4;
  float computed_risk = 5;
}

message AgentEvent {
  string event_id = 1;
  string source_agent = 2;
  string event_type = 3;
  string payload_json = 4;
  int64 timestamp_unix_ms = 5;
  string severity = 6;
}

message EventSubscription {
  string subscriber_agent = 1;
  repeated string event_types = 2;
  string filter_expression = 3;
}

service CognosAgent {
  rpc Dispatch(IntentEnvelope) returns (AgentResponse);

  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  rpc CapabilityCheck(CapabilityRequest) returns (CapabilityResponse);

  rpc HeartbeatStream(stream HeartbeatRequest) returns (stream HeartbeatResponse);

  rpc EventStream(EventSubscription) returns (stream AgentEvent);
}
