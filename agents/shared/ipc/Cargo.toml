[package]
name = "cognos-ipc"
version = "0.1.0"
edition = "2021"

build = "proto/build.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.11", features = ["transport", "tls"] }
prost = "0.12"
prost-types = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ring = "0.17"
rustls = "0.22"
tokio-rustls = "0.25"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
chrono = "0.4"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
hostname = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
anyhow = "1"

[build-dependencies]
tonic-build = "0.11"